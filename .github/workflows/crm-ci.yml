name: CRM — CI

# NOTA: a pesar del nombre (quedó de cuando este workflow nació sólo para
# CRM), el trigger de pull_request ya corre en TODO PR hacia develop/main,
# sin importar qué módulo se haya tocado. Por eso el job de tests corre la
# suite completa de PHPUnit (no solo --filter=CRM): así cualquier módulo con
# cobertura (CRM, Activos Fijos, y los que se vayan agregando) queda
# validado automáticamente sin tener que volver a tocar este archivo.
on:
  push:
    branches:
      - "feature/crm-*"
  pull_request:
    branches:
      - develop
      - main

jobs:
  # ──────────────────────────────────────────────────────────────
  # Backend: PHPUnit — suite completa (CRM, Activos Fijos, y lo que se
  # vaya agregando). Se mantiene el nombre del job para no romper checks
  # requeridos ya configurados en las reglas de protección de rama.
  # ──────────────────────────────────────────────────────────────
  backend-tests:
    name: PHP Tests (CRM)
    runs-on: ubuntu-latest

    # NOTA: no hay servicio MySQL aquí a propósito. phpunit.xml fuerza
    # (force="true") DB_CONNECTION=sqlite / DB_DATABASE=:memory: sin importar
    # qué haya en el entorno, y tests/TestCase.php aborta el proceso si la
    # conexión resuelta no es esa — ver el incidente de agosto 2026 descrito
    # ahí. Los tests corren contra SQLite en memoria y Laravel migra solo vía
    # RefreshDatabase, así que no hace falta MySQL, .env.testing, ni un paso
    # de `migrate` separado.

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: pdo, pdo_sqlite, mbstring, bcmath
          coverage: none

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Copy .env for testing
        run: cp .env.example .env

      - name: Generate application key
        run: php artisan key:generate

      # 🛑 Nunca --env=testing aquí: filtra variables de .env al proceso hijo
      # y puede sobreescribir el force="true" de phpunit.xml. Ver CLAUDE.md.
      - name: Run backend test suite
        run: php artisan test

  # NOTA: hubo un job `frontend-build` aquí que buscaba cambios en
  # 'sentinel-front/src/views/crm/' y 'sentinel-front/src/hooks/crm/'. Este
  # workflow vive en el repo standalone sentinel-back (no en el monorepo), y
  # ese checkout nunca tiene una carpeta sentinel-front/ (no es submódulo ni
  # existe aquí) — el diff siempre daba 0 archivos y el job era un no-op
  # permanente. Se quitó por no aportar nada; main no tiene branch protection
  # que dependiera de su nombre como required check (verificado vía
  # `gh api repos/ManuelES23/sentinel-back/branches/main/protection` → 404
  # "Branch not protected"). Si el frontend vuelve a vivir en este repo (o se
  # agrega como submódulo), un job equivalente puede recrearse apuntando a la
  # ruta real.
